name: ci-integration
on:
  pull_request:
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest   # free for public repos
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install package + dev deps
        run: |
          pip install -U pip
          pip install -e ".[dev]"
      - name: Run integration + e2e tests (testcontainers-backed; skip gracefully if unavailable)
        env:
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
        run: pytest -m "integration or e2e" -q
