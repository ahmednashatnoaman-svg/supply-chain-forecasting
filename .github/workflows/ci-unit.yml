name: ci-unit
on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest   # free for public repos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install package + dev deps
        run: |
          pip install -U pip
          pip install -e ".[dev]"
      - name: Run fast unit + contract tests
        run: pytest -m unit -q
