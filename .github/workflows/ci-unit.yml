name: ci-unit
on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest   # free for public repos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install package + dev deps
        run: |
          pip install -U pip
          pip install -e ".[dev]"
      - name: Run fast unit + contract tests
        run: pytest -m unit -q
      - name: Run data-quality (Great Expectations) suites
        # Same `spark` fixture as the pyspark-backed unit tests above (in-memory synthetic
        # DataFrames, no HDFS/real cluster needed) -- these had a `pytest.mark.data_quality`
        # marker and a `make dq` target but were never actually wired into any CI workflow, so a
        # broken silver-zone contract could merge unnoticed. Testing/validation audit follow-up.
        run: pytest -m data_quality -q
