# Supply Chain Forecasting — full local stack (Nagy, plan Task 1). 100% free / self-hosted OSS.
# Profiles: `core` (kafka+redis+spark+hdfs) and `full` (adds mlflow, n8n, monitoring).
#   PROFILE=core  docker compose --profile core up -d
#   docker compose --profile full up -d      # everything
name: scf

networks:
  scf-net:
    driver: bridge

volumes:
  hdfs-name:
  hdfs-data:
  grafana-data:
  airflow-db:
  mlflow-data:
  n8n-data:

services:
  # ---------------- Kafka + Schema Registry ----------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1   # free (Confluent Community License, self-host $0)
    profiles: [core, full]
    networks: [scf-net]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    profiles: [core, full]
    depends_on: [zookeeper]
    networks: [scf-net]
    # Host-published ports bind to 127.0.0.1 only -- this is a single-laptop dev stack (see
    # infra/README.md), not a LAN service; inter-container traffic goes over `scf-net` regardless
    # of this binding, so it has zero effect on Spark/Kafka/etc. reaching each other by service name.
    ports: ["127.0.0.1:9092:9092", "127.0.0.1:29092:29092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Dual listeners: INTERNAL for containers, EXTERNAL for host (laptop) tools.
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.1  # free; Apache-2.0 Apicurio is the OSS-pure alt
    profiles: [core, full]
    depends_on: [kafka]
    networks: [scf-net]
    ports: ["127.0.0.1:8081:8081"]
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/subjects"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ---------------- Hadoop / HDFS ----------------
  namenode:
    image: apache/hadoop:3.3.6
    profiles: [core, full]
    hostname: namenode
    networks: [scf-net]
    ports: ["127.0.0.1:9870:9870", "127.0.0.1:9000:9000"]
    # Run as root so Docker volume (root-owned) can be formatted + written.
    # The starter.sh script generates XML config from env vars, then starts the namenode.
    # ENSURE_NAMENODE_DIR points to the 'current' subdirectory (only created after format)
    # so the first-boot format is triggered correctly even though Docker pre-creates the mount dir.
    user: root
    command: ["hdfs", "namenode"]
    environment:
      ENSURE_NAMENODE_DIR: /opt/hadoop/data/namenode/current
      CORE-SITE.XML_fs.defaultFS: hdfs://namenode:9000
      CORE-SITE.XML_hadoop.http.staticuser.user: root
      HDFS-SITE.XML_dfs.replication: "1"
      HDFS-SITE.XML_dfs.namenode.rpc-bind-host: "0.0.0.0"
      HDFS-SITE.XML_dfs.permissions.enabled: "false"
      HDFS-SITE.XML_dfs.namenode.name.dir: /opt/hadoop/data/namenode
      HDFS-SITE.XML_dfs.datanode.data.dir: /opt/hadoop/data/datanode
    volumes: ["hdfs-name:/opt/hadoop/data/namenode"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9870"]
      interval: 15s
      timeout: 10s
      retries: 10

  datanode:
    image: apache/hadoop:3.3.6
    profiles: [core, full]
    depends_on: [namenode]
    networks: [scf-net]
    user: root
    command: ["hdfs", "datanode"]
    environment:
      CORE-SITE.XML_fs.defaultFS: hdfs://namenode:9000
      HDFS-SITE.XML_dfs.replication: "1"
      HDFS-SITE.XML_dfs.permissions.enabled: "false"
      HDFS-SITE.XML_dfs.datanode.data.dir: /opt/hadoop/data/datanode
    volumes: ["hdfs-data:/opt/hadoop/data/datanode"]



  # ---------------- Spark cluster ----------------
  spark-master:
    image: apache/spark:3.5.1
    profiles: [core, full]
    networks: [scf-net]
    ports: ["127.0.0.1:7077:7077", "127.0.0.1:8088:8080"]   # 8080 remapped: host port 8080 used by Oracle TNS Listener
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    environment:
      SPARK_MASTER_HOST: spark-master

  spark-worker:
    image: apache/spark:3.5.1
    profiles: [core, full]
    depends_on: [spark-master]
    networks: [scf-net]
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      # 4 cores / 8G leaves the always-on streaming job enough headroom for a batch run to actually
      # get resources concurrently instead of queuing forever on "Initial job has not accepted any
      # resources" -- was 2/2G, sized for a single job at a time. 8G (up from an initial 4G) because
      # build_graph's GraphFrames self-join OOM'd a 2G executor on the real ~2.2M-row dataset.
      SPARK_WORKER_CORES: "4"
      SPARK_WORKER_MEMORY: "8G"
    deploy:
      replicas: 1   # scale with: docker compose up -d --scale spark-worker=3

  # ---------------- Redis (serving layer) ----------------
  redis:
    image: redis:7-alpine
    profiles: [core, full]
    networks: [scf-net]
    ports: ["127.0.0.1:6379:6379"]
    # `--requirepass ""` (the default when REDIS_PASSWORD is unset) means "no auth required",
    # matching the zero-config local dev experience; set REDIS_PASSWORD in .env to actually enable
    # auth end-to-end (previously the Python client would AUTH with it but the server never
    # required one, which breaks the connection -- see libs/scf_common/config's RedisSettings).
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------- Airflow (nightly batch orchestration, Emad) ----------------
  # Version pinned to match `apache-airflow==2.9.2` in pyproject.toml (2.x architecture:
  # webserver + scheduler, not the 3.x apiserver/dag-processor split).
  airflow-postgres:
    image: postgres:16-alpine
    profiles: [full]
    networks: [scf-net]
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes: ["airflow-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 10

  airflow-init:
    build: {context: ../.., dockerfile: infra/docker/airflow.Dockerfile}
    profiles: [full]
    depends_on:
      airflow-postgres:
        condition: service_healthy
    networks: [scf-net]
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      # Without a pinned value, webserver/scheduler/triggerer each generate their own random
      # secret_key on boot -- the webserver then fails with a 403 fetching task logs from the
      # scheduler/triggerer, since it signs the log-fetch request with a key they don't share.
      AIRFLOW__WEBSERVER__SECRET_KEY: "${AIRFLOW_SECRET_KEY:-scf-dev-secret-key-change-in-prod}"
    volumes: ["../../batch/airflow_dags:/opt/airflow/dags"]
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create --username admin --firstname Admin --lastname User \
          --role Admin --email admin@example.com \
          --password "${AIRFLOW_ADMIN_PASSWORD:-admin}" || true

  airflow-webserver:
    build: {context: ../.., dockerfile: infra/docker/airflow.Dockerfile}
    profiles: [full]
    depends_on: [airflow-init]
    networks: [scf-net]
    ports: ["127.0.0.1:8082:8080"]   # 8080 already used by spark-master's UI
    environment: *airflow-env
    volumes: ["../../batch/airflow_dags:/opt/airflow/dags"]
    command: ["webserver"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 10

  airflow-scheduler:
    build: {context: ../.., dockerfile: infra/docker/airflow.Dockerfile}
    profiles: [full]
    depends_on: [airflow-init]
    networks: [scf-net]
    environment: *airflow-env
    # DockerOperator (nightly_dag.py) launches scf-batch-pipeline via the host's Docker daemon --
    # this grants the scheduler container root-equivalent access to the host. Scoped to the
    # scheduler only (where LocalExecutor actually runs tasks); webserver/init don't need it just
    # to parse/render the DAG file.
    volumes:
      - "../../batch/airflow_dags:/opt/airflow/dags"
      - "/var/run/docker.sock:/var/run/docker.sock"
    command: ["scheduler"]

  # ---------------- MLflow (model registry) ----------------
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.14.1
    profiles: [full]
    networks: [scf-net]
    ports: ["127.0.0.1:5000:5000"]
    volumes: ["mlflow-data:/mlflow"]   # persist DB + artifacts; fixes sqlite3 'unable to open' error
    command: ["mlflow", "server", "--host", "0.0.0.0", "--port", "5000",
              "--backend-store-uri", "sqlite:////mlflow/mlflow.db",
              "--default-artifact-root", "/mlflow/artifacts"]

  # ---------------- n8n (automation) ----------------
  n8n:
    image: n8nio/n8n:latest
    profiles: [full]
    networks: [scf-net]
    ports: ["127.0.0.1:5678:5678"]
    volumes: ["n8n-data:/home/node/.n8n"]   # persist workflows/executions/credentials across recreates
    environment:
      N8N_SECURE_COOKIE: "false"
      # n8n's Function/Code nodes run arbitrary JS and its HTTP node can reach every other
      # container on scf-net -- basic auth is a real gate, not box-checking, even behind the
      # 127.0.0.1 binding above. `:?` (hard-require, no fallback) was tried here but `docker
      # compose config` interpolates every service's env vars regardless of --profile filtering
      # (profile exclusion happens after parsing), so it broke `--profile core up` too even though
      # n8n itself is profiles:[full]-only. Soft default + a loud comment instead: change these in
      # .env before ever running `--profile full` on a shared or internet-reachable machine.
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: "${N8N_BASIC_AUTH_USER:-admin}"
      N8N_BASIC_AUTH_PASSWORD: "${N8N_BASIC_AUTH_PASSWORD:-changeme}"
      # Read by reorder_workflow.json's "Verify Shared Secret" node; must match this app's
      # N8N_WEBHOOK_SECRET (empty in both by default -- the workflow ships inactive/simulated).
      WEBHOOK_SHARED_SECRET: "${N8N_WEBHOOK_SECRET:-}"

  # ---------------- Monitoring ----------------
  prometheus:
    image: prom/prometheus:v2.53.0
    profiles: [full]
    networks: [scf-net]
    ports: ["127.0.0.1:9090:9090"]
    volumes: ["../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]

  grafana:
    image: grafana/grafana:11.1.0
    profiles: [full]
    depends_on: [prometheus]
    networks: [scf-net]
    ports: ["127.0.0.1:3001:3000"]   # 3000 remapped: host port 3000 already in use on this machine
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - "grafana-data:/var/lib/grafana"
      - "../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro"
      - "../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro"

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    profiles: [full]
    depends_on: [redis]
    networks: [scf-net]
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
    ports: ["127.0.0.1:9121:9121"]

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    profiles: [full]
    depends_on: [kafka]
    networks: [scf-net]
    command: ["--kafka.server=kafka:9092"]
    ports: ["127.0.0.1:9308:9308"]
