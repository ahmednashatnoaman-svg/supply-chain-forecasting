# Supply Chain Forecasting — full local stack (Nagy, plan Task 1). 100% free / self-hosted OSS.
# Profiles: `core` (kafka+redis+spark+hdfs) and `full` (adds mlflow, n8n, monitoring).
#   PROFILE=core  docker compose --profile core up -d
#   docker compose --profile full up -d      # everything
name: scf

networks:
  scf-net:
    driver: bridge

volumes:
  hdfs-name:
  hdfs-data:
  grafana-data:
  airflow-db:
  mlflow-data:

services:
  # ---------------- Kafka + Schema Registry ----------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1   # free (Confluent Community License, self-host $0)
    profiles: [core, full]
    networks: [scf-net]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    profiles: [core, full]
    depends_on: [zookeeper]
    networks: [scf-net]
    ports: ["9092:9092", "29092:29092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Dual listeners: INTERNAL for containers, EXTERNAL for host (laptop) tools.
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.1  # free; Apache-2.0 Apicurio is the OSS-pure alt
    profiles: [core, full]
    depends_on: [kafka]
    networks: [scf-net]
    ports: ["8081:8081"]
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/subjects"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ---------------- Hadoop / HDFS ----------------
  namenode:
    image: apache/hadoop:3.3.6
    profiles: [core, full]
    hostname: namenode
    networks: [scf-net]
    ports: ["9870:9870", "9000:9000"]
    # Run as root so Docker volume (root-owned) can be formatted + written.
    # The starter.sh script generates XML config from env vars, then starts the namenode.
    # ENSURE_NAMENODE_DIR points to the 'current' subdirectory (only created after format)
    # so the first-boot format is triggered correctly even though Docker pre-creates the mount dir.
    user: root
    command: ["hdfs", "namenode"]
    environment:
      ENSURE_NAMENODE_DIR: /opt/hadoop/data/namenode/current
      CORE-SITE.XML_fs.defaultFS: hdfs://namenode:9000
      CORE-SITE.XML_hadoop.http.staticuser.user: root
      HDFS-SITE.XML_dfs.replication: "1"
      HDFS-SITE.XML_dfs.namenode.rpc-bind-host: "0.0.0.0"
      HDFS-SITE.XML_dfs.permissions.enabled: "false"
      HDFS-SITE.XML_dfs.namenode.name.dir: /opt/hadoop/data/namenode
      HDFS-SITE.XML_dfs.datanode.data.dir: /opt/hadoop/data/datanode
    volumes: ["hdfs-name:/opt/hadoop/data/namenode"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9870"]
      interval: 15s
      timeout: 10s
      retries: 10

  datanode:
    image: apache/hadoop:3.3.6
    profiles: [core, full]
    depends_on: [namenode]
    networks: [scf-net]
    user: root
    command: ["hdfs", "datanode"]
    environment:
      CORE-SITE.XML_fs.defaultFS: hdfs://namenode:9000
      HDFS-SITE.XML_dfs.replication: "1"
      HDFS-SITE.XML_dfs.permissions.enabled: "false"
      HDFS-SITE.XML_dfs.datanode.data.dir: /opt/hadoop/data/datanode
    volumes: ["hdfs-data:/opt/hadoop/data/datanode"]



  # ---------------- Spark cluster ----------------
  spark-master:
    image: apache/spark:3.5.1
    profiles: [core, full]
    networks: [scf-net]
    ports: ["7077:7077", "8088:8080"]   # 8080 remapped: host port 8080 used by Oracle TNS Listener
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    environment:
      SPARK_MASTER_HOST: spark-master

  spark-worker:
    image: apache/spark:3.5.1
    profiles: [core, full]
    depends_on: [spark-master]
    networks: [scf-net]
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_MEMORY: "2G"
    deploy:
      replicas: 1   # scale with: docker compose up -d --scale spark-worker=3

  # ---------------- Redis (serving layer) ----------------
  redis:
    image: redis:7-alpine
    profiles: [core, full]
    networks: [scf-net]
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------- Airflow (nightly batch orchestration, Emad) ----------------
  # Version pinned to match `apache-airflow==2.9.2` in pyproject.toml (2.x architecture:
  # webserver + scheduler, not the 3.x apiserver/dag-processor split).
  airflow-postgres:
    image: postgres:16-alpine
    profiles: [full]
    networks: [scf-net]
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes: ["airflow-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 10

  airflow-init:
    image: apache/airflow:2.9.2
    profiles: [full]
    depends_on:
      airflow-postgres:
        condition: service_healthy
    networks: [scf-net]
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    volumes: ["../../batch/airflow_dags:/opt/airflow/dags"]
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create --username admin --firstname Admin --lastname User \
          --role Admin --email admin@example.com --password admin || true

  airflow-webserver:
    image: apache/airflow:2.9.2
    profiles: [full]
    depends_on: [airflow-init]
    networks: [scf-net]
    ports: ["8082:8080"]   # 8080 already used by spark-master's UI
    environment: *airflow-env
    volumes: ["../../batch/airflow_dags:/opt/airflow/dags"]
    command: ["webserver"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 10

  airflow-scheduler:
    image: apache/airflow:2.9.2
    profiles: [full]
    depends_on: [airflow-init]
    networks: [scf-net]
    environment: *airflow-env
    volumes: ["../../batch/airflow_dags:/opt/airflow/dags"]
    command: ["scheduler"]

  # ---------------- MLflow (model registry) ----------------
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.14.1
    profiles: [full]
    networks: [scf-net]
    ports: ["5000:5000"]
    volumes: ["mlflow-data:/mlflow"]   # persist DB + artifacts; fixes sqlite3 'unable to open' error
    command: ["mlflow", "server", "--host", "0.0.0.0", "--port", "5000",
              "--backend-store-uri", "sqlite:////mlflow/mlflow.db",
              "--default-artifact-root", "/mlflow/artifacts"]

  # ---------------- n8n (automation) ----------------
  n8n:
    image: n8nio/n8n:latest
    profiles: [full]
    networks: [scf-net]
    ports: ["5678:5678"]
    environment:
      N8N_SECURE_COOKIE: "false"

  # ---------------- Monitoring ----------------
  prometheus:
    image: prom/prometheus:v2.53.0
    profiles: [full]
    networks: [scf-net]
    ports: ["9090:9090"]
    volumes: ["../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]

  grafana:
    image: grafana/grafana:11.1.0
    profiles: [full]
    depends_on: [prometheus]
    networks: [scf-net]
    ports: ["3001:3000"]   # 3000 remapped: host port 3000 already in use on this machine
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - "grafana-data:/var/lib/grafana"
      - "../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro"
      - "../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro"

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    profiles: [full]
    depends_on: [redis]
    networks: [scf-net]
    environment:
      REDIS_ADDR: redis://redis:6379
    ports: ["9121:9121"]

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    profiles: [full]
    depends_on: [kafka]
    networks: [scf-net]
    command: ["--kafka.server=kafka:9092"]
    ports: ["9308:9308"]
