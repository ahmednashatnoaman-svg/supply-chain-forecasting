# Prometheus scrape config (Nagy, plan Task 3). Scrapes exporters + each Python layer's /metrics.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]

  # Python layers expose /metrics via libs.scf_common.observability.serve_metrics(port).
  # Targeted by container name, not host.docker.internal: these run as containers on this same
  # scf-net bridge network (docker run --network scf-net --name <target>), not host processes,
  # so container-name DNS resolution works without publishing the port to the host at all.
  # batch/ingestion are one-shot jobs -- Prometheus will correctly show them "down" between runs.
  - job_name: streaming
    static_configs:
      - targets: ["scf-pricing-stream-run:8000"]  # streaming pricing engine
  - job_name: batch
    static_configs:
      - targets: ["scf-batch-pipeline-run:8001"]
  - job_name: ingestion
    static_configs:
      - targets: ["scf-traffic-generator-run:8002"]
