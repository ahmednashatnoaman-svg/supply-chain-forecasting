# Traffic generator configuration (Hatem). Loaded by traffic_generator.run().
# Single source of producer config (decision D-E): speed, surges, dataset path, split paths.
dataset:
  # Pre-split CSVs produced by `python -m ingestion.generator.split`.
  # The producer replays the TEST (live) split; the TRAIN split is staged to HDFS bronze.
  events_csv: data/raw/events_test.csv
  train_csv: data/raw/events_train.csv
  test_csv: data/raw/events_test.csv
  # Fraction of the dataset reserved for the live stream (rest is history for HDFS/batch).
  live_fraction: 0.2

playback:
  speed: 100            # base playback multiplier (100x real time)
  loop: false

# Synthetic surge windows keyed on EVENT time (the dataset's own 2015-09 timestamps, not wall-clock).
# SurgeSchedule expects (start_iso, end_iso, multiplier); multiplier > 1 shrinks inter-event sleep.
surges:
  - start: "2015-09-15T12:00:00"
    end:   "2015-09-15T13:00:00"
    multiplier: 8.0
  - start: "2015-09-18T20:00:00"
    end:   "2015-09-18T20:30:00"
    multiplier: 12.0
