# Traffic generator configuration (Hatem). Loaded by traffic_generator.
dataset:
  events_csv: data/raw/events.csv
  # Fraction of the dataset reserved for the live stream (rest is history for HDFS/batch).
  live_fraction: 0.2

playback:
  speed: 100            # base playback multiplier (100x real time)
  loop: false

# Synthetic surge windows: (start_iso, end_iso, speed_multiplier). Simulates viral buying waves.
surges:
  - start: "2015-09-15T12:00:00"
    end:   "2015-09-15T13:00:00"
    multiplier: 8.0
  - start: "2015-09-18T20:00:00"
    end:   "2015-09-18T20:30:00"
    multiplier: 12.0
