[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "supply-chain-forecasting"
version = "0.1.0"
description = "Production-grade demand forecasting & dynamic pricing on Spark, Kafka, Hadoop"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Supply Chain Forecasting Team" }]

dependencies = [
    "pyspark==3.5.1",
    "graphframes==0.6",
    "confluent-kafka==2.5.0",
    "fastavro==1.9.4",
    "redis==5.0.7",
    "torch==2.3.1",
    "numpy==1.26.4",
    "pandas==2.2.2",
    "mlflow==2.16.2",
    "great-expectations==0.18.19",
    "apache-airflow==2.9.2",
    "streamlit==1.37.1",
    "plotly==5.22.0",
    "python-dotenv==1.0.1",
    "pydantic==2.8.2",
    "prometheus-client==0.20.0",
    "requests==2.32.3",
    # Explicit protobuf pin: resolves the mlflow/streamlit/opentelemetry-proto triangle.
    # mlflow>=2.16 and streamlit>=1.37 both accept protobuf>=5; airflow's opentelemetry-proto
    # requires >=5. Capped at <6 until streamlit explicitly tests 6.x.
    "protobuf>=5.27,<6",
    "structlog==24.2.0",
    "pyyaml==6.0.1",
]

[project.optional-dependencies]
finance = [
    # OPTIONAL — Plaid Sandbox (free) supplier-payment reconciliation. Not required for the core platform.
    "plaid-python==21.0.0",
]
dev = [
    "pytest==8.2.2",
    "pytest-cov==5.0.0",
    "chispa==0.10.1",
    "testcontainers[kafka,redis]==4.7.1",
    "fakeredis==2.23.3",
    "ruff==0.5.1",
    "black==24.4.2",
    "mypy==1.10.1",
    "pre-commit==3.7.1",
]

[tool.setuptools.packages.find]
include = ["libs*", "batch*", "streaming*", "ingestion*", "automation*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
# E501: black owns code line-length; ruff would also flag long docstrings/comments black won't wrap.
# N812: `from pyspark.sql import functions as F` is the universal PySpark convention.
ignore = ["E501", "N812"]

[tool.ruff.lint.per-file-ignores]
# Streamlit REQUIRES numbered page filenames (1_*.py) for sidebar ordering — allow the "invalid" name.
"automation/dashboard/pages/*" = ["N999"]
# Tests: allow long descriptive assert lines.
"tests/*" = ["E501"]

[tool.black]
line-length = 100

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast isolated tests",
    "integration: needs Kafka/Redis/Spark via testcontainers",
    "e2e: full walking-skeleton path",
    "data_quality: Great Expectations suites",
]
